spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate was removed: it silently skipped all migrations on a fresh empty DB.
    # Flyway will run all migrations from V1 on a new database as intended.

app:
  jwt:
    # JWT_SECRET must be set as an environment variable. No fallback is provided.
    # Generate a secure value with: openssl rand -base64 32
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000